# Kosha behind nginx. The app listens on 127.0.0.1:8050.
limit_req_zone $binary_remote_addr zone=kosha:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=kosha_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name kosha.pragnyalabs.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kosha.pragnyalabs.com;

    ssl_certificate /etc/letsencrypt/live/kosha.pragnyalabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kosha.pragnyalabs.com/privkey.pem;

    # Capture envelopes are a few hundred KB; the app itself refuses anything above 20 MB.
    client_max_body_size 20m;

    location = /api/auth/login {
        limit_req zone=kosha_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=kosha burst=60 nodelay;
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ask and MCP stream their replies.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
